	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.webgl-content {
			width: 100%;
			height: 100%;
		}

		#gameContainer {
			width: 100vw;
			height: 100vh;
		}

		#gameContainer canvas {
			display: block;
			width: 100% !important;
			height: 100% !important;
		}

		#loadingOverlay {
			position: fixed;
			inset: 0;
			z-index: 10;
			background: #171816;
			opacity: 1;
			transition: opacity 200ms ease;
		}

		#loadingOverlay.is-hidden { opacity: 0; pointer-events: none; }
		#loadingScreen { display: block; width: 100%; height: 100%; border: 0; }

		@media (prefers-reduced-motion: reduce) {
			#loadingOverlay { transition-duration: 1ms; }
		}

		::before, ::after {
			display: none;
		}
	</style>
	<script>
		var loadingFrameReady = false;
		var unityGameReady = false;
		var latestUnityProgress = 0;
		var loadingOverlay;

		function hideLoadingOverlay() {
			if (!loadingFrameReady || !unityGameReady || !loadingOverlay) return;
			loadingOverlay.classList.add("is-hidden");
			window.setTimeout(function () { loadingOverlay.remove(); }, 850);
		}

		function handleUnityProgress(instance, progress) {
			UnityProgress(instance, progress);
			latestUnityProgress = Math.max(0, Math.min(1, Number(progress) || 0));
			var frame = document.getElementById("loadingScreen");
			if (frame && frame.contentWindow) {
				frame.contentWindow.postMessage({ type: "unity-progress", progress: latestUnityProgress }, "*");
			}
			if (latestUnityProgress >= 1) {
				unityGameReady = true;
				setTimeout(hideLoadingOverlay, 3000);
			}
		}

		var gameInstance = UnityLoader.instantiate("gameContainer", "Build/Bad Piggies.json", {
			onProgress: handleUnityProgress,
			compatibilityCheck: function (container, continueLoading, failLoading) {
				if (UnityLoader.SystemInfo.mobile && UnityLoader.SystemInfo.hasWebGL) {
					continueLoading();
					return;
				}
				UnityLoader.compatibilityCheck(container, continueLoading, failLoading);
			}
		});
	</script>
</head>
