<!DOCTYPE html>
<!-- saved from url=(0035)http://127.0.0.1:8080/settings.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Settings | algot.fun</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: "Trebuchet MS", sans-serif;
			background: #10191b;
			color: #f3f5f2;
			font-synthesis: none;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: #10191b;
		}

		/* Fullscreen Page Preview */
		.preview-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: #10191b;
			z-index: 1;
		}

		.page-preview {
			position: absolute;
			top: 0;
			left: 0;
			display: block;
			width: 100vw;
			height: 100vh;
			border: 0;
			background: transparent;
			pointer-events: auto;
		}

		/* Floating Overlay Controls stacked at the bottom middle */
		.overlay-ui {
			position: absolute;
			z-index: 10;
			display: flex;
			flex-direction: column;
			gap: 12px;
			pointer-events: none;
			padding: 24px;
			width: 100%;
			height: 100%;
			justify-content: flex-end;
			align-items: center;
		}

		.control-group {
			display: flex;
			gap: 12px;
			align-items: center;
			pointer-events: auto;
			background: rgba(16, 23, 24, 0.8);
			backdrop-filter: blur(12px);
			padding: 10px 16px;
			border-radius: 12px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
		}

		.carousel-btn {
			display: inline-flex;
			min-height: 38px;
			align-items: center;
			justify-content: center;
			padding: 0 16px;
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.08);
			color: #f3f5f2;
			font: inherit;
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			transition: background 160s ease, transform 160s ease;
		}

		.carousel-btn:hover {
			background: rgba(255, 255, 255, 0.18);
		}

		.carousel-btn.active-daily {
			border-color: #9ce0b7;
			background: #31524155;
			color: #a9e3be;
		}

		.carousel-indicator {
			font-size: 13px;
			color: #aab8b1;
			font-weight: 600;
			min-width: 90px;
			text-align: center;
		}

		.status {
			position: absolute;
			bottom: 140px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(16, 23, 24, 0.85);
			backdrop-filter: blur(12px);
			padding: 8px 16px;
			border-radius: 8px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			color: #a9e3be;
			font-size: 13px;
			z-index: 20;
			pointer-events: none;
			opacity: 0;
			transition: opacity 200s ease;
		}

		.status.visible {
			opacity: 1;
		}

		.status[data-error="true"] { color: #ffb6a8; }

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>

	<!-- Fullscreen Live Preview Layer -->
	<div class="preview-container" id="preview-container">
		<iframe class="page-preview" id="active-preview" title="Homepage Preview" src="about:blank"></iframe>
	</div>

	<!-- Overlay UI Controls (Stacked at bottom middle) -->
	<div class="overlay-ui">
		<div class="control-group">
			<button class="carousel-btn" id="prev-page" type="button">Prev Index</button>
			<span class="carousel-indicator" id="page-indicator">1 / 5</span>
			<button class="carousel-btn" id="next-page" type="button">Next Index</button>
		</div>

		<div class="control-group">
			<button class="carousel-btn" id="prev-bg" type="button">Prev Background</button>
			<button class="carousel-btn" id="daily-bg" type="button">Daily</button>
			<span class="carousel-indicator" id="bg-indicator">1 / 54</span>
			<button class="carousel-btn" id="next-bg" type="button">Next Background</button>
		</div>
	</div>

	<div class="status" id="status" role="status" aria-live="polite"></div>

	<script>
		const PAGE_KEY = 'algot.indexPage';
		const BACKGROUND_KEY = 'algot.topoBackground';

		// Define Homepage Options
		const pages = [
			{ value: 'index.html', label: 'Liquid glass (Default)', src: '/index.html' },
			{ value: 'index1.html', label: 'Frosted glass', src: '/index1.html' },
			{ value: 'index2.html', label: 'neon', src: '/index2.html' },
			{ value: 'index3.html', label: 'Legacy', src: '/index3.html' },
			{ value: 'index4.html', label: 'commandline', src: '/index4.html' }
		];

		let currentPageIndex = 0;
		let currentBgIndex = 0;
		let backgroundChoices = [];

		// Initialize Backgrounds list (Daily + 53 bundled options)
		function getDailyImage() {
			const start = new Date(new Date().getFullYear(), 0, 0);
			const day = Math.floor((Date.now() - start) / 86400000);
			return `/backgrounds/${(day % 53) + 1}.webp`;
		}

		backgroundChoices.push({ type: 'daily', path: getDailyImage(), label: 'Daily rotation' });
		for (let i = 1; i <= 53; i++) {
			backgroundChoices.push({ type: 'bundled', path: `/backgrounds/${i}.webp`, label: `Background ${i}` });
		}

		const activePreview = document.getElementById('active-preview');
		const prevPageBtn = document.getElementById('prev-page');
		const nextPageBtn = document.getElementById('next-page');
		const pageIndicator = document.getElementById('page-indicator');

		const prevBgBtn = document.getElementById('prev-bg');
		const nextBgBtn = document.getElementById('next-bg');
		const dailyBgBtn = document.getElementById('daily-bg');
		const bgIndicator = document.getElementById('bg-indicator');
		const status = document.getElementById('status');
		let statusTimeout = null;

		function setStatus(message, isError = false) {
			status.textContent = message;
			status.dataset.error = String(isError);
			status.classList.add('visible');
			clearTimeout(statusTimeout);
			statusTimeout = setTimeout(() => {
				status.classList.remove('visible');
			}, 2500);
		}

		// Update Homepage View
		function updatePage() {
			const page = pages[currentPageIndex];
			activePreview.src = page.src;
			pageIndicator.textContent = `${currentPageIndex + 1} / ${pages.length}`;
			try {
				localStorage.setItem(PAGE_KEY, page.value);
				setStatus(`Selected: ${page.label}`);
			} catch {
				setStatus('Could not save homepage choice.', true);
			}
		}

		prevPageBtn.addEventListener('click', () => {
			currentPageIndex = (currentPageIndex - 1 + pages.length) % pages.length;
			updatePage();
		});

		nextPageBtn.addEventListener('click', () => {
			currentPageIndex = (currentPageIndex + 1) % pages.length;
			updatePage();
		});

		// Update Background View
		function updateBackground() {
			const bg = backgroundChoices[currentBgIndex];
			bgIndicator.textContent = `${currentBgIndex + 1} / ${backgroundChoices.length}`;
			
			// Highlight daily button if index is 0 (Daily)
			if (currentBgIndex === 0) {
				dailyBgBtn.classList.add('active-daily');
			} else {
				dailyBgBtn.classList.remove('active-daily');
			}

			try {
				if (bg.type === 'daily') {
					localStorage.removeItem(BACKGROUND_KEY);
					setStatus('Daily background rotation enabled.');
				} else {
					localStorage.setItem(BACKGROUND_KEY, bg.path);
					setStatus(`Selected: ${bg.label}`);
				}
			} catch {
				setStatus('Could not save background choice.', true);
			}
		}

		prevBgBtn.addEventListener('click', () => {
			currentBgIndex = (currentBgIndex - 1 + backgroundChoices.length) % backgroundChoices.length;
			updateBackground();
		});

		nextBgBtn.addEventListener('click', () => {
			currentBgIndex = (currentBgIndex + 1) % backgroundChoices.length;
			updateBackground();
		});

		dailyBgBtn.addEventListener('click', () => {
			currentBgIndex = 0; // Daily is the first item
			updateBackground();
		});

		// Initial Sync from localStorage
		const savedPage = localStorage.getItem(PAGE_KEY);
		if (savedPage) {
			const foundIdx = pages.findIndex(p => p.value === savedPage);
			if (foundIdx !== -1) currentPageIndex = foundIdx;
		}

		const savedBg = localStorage.getItem(BACKGROUND_KEY);
		if (savedBg) {
			const foundBgIdx = backgroundChoices.findIndex(b => b.path === savedBg);
			if (foundBgIdx !== -1) currentBgIndex = foundBgIdx;
		} else {
			currentBgIndex = 0; // Default to daily if nothing saved
		}

		// Render initial states
		activePreview.src = pages[currentPageIndex].src;
		pageIndicator.textContent = `${currentPageIndex + 1} / ${pages.length}`;
		bgIndicator.textContent = `${currentBgIndex + 1} / ${backgroundChoices.length}`;
		if (currentBgIndex === 0) {
			dailyBgBtn.classList.add('active-daily');
		}
	</script>
</body></html>
